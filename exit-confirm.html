<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>אישור יציאה מהמועדון — Back to Life</title>

  <!--
    ============================================================
    "אישור יציאה מהמועדון" — גרסה מינימלית (Back to Life)
    ============================================================
    מיועד לשליחה בהודעה: הלינק כבר מכיל את הפרטים.
    משרשרים רק שני פרמטרים:
      - IDCRM  (מזהה נסתר)
      - phone  (מספר הטלפון — מוצג בשדה נעול)

    דוגמה:
      exit-confirm.html?IDCRM=12345&phone=0501234567

    בסיום נשלחים ל-webhook: IDCRM, phone, whatsapp_confirmed,
    form, submitted_at, page_url + כל פרמטר נוסף שיושרשר.
    ============================================================
  -->

  <style>
    :root {
      --bg: #f7f4ef;
      --surface: #ffffff;
      --border: #e7e1d8;
      --teal: #17a3a3;
      --teal-deep: #0f6f70;
      --ink: #2b2b2b;
      --ink-soft: #52534f;
      --ink-faint: #9a9a94;
      --error: #d6584f;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Assistant", "Rubik", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; min-height: 100%; line-height: 1.55;
    }
    header { border-bottom: 1px solid var(--border); background: var(--surface); }
    header .inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; }
    header .brand { font-size: 18px; font-weight: 700; color: var(--teal-deep); }
    header .brand small { color: var(--ink-faint); font-size: 13px; font-weight: 400; }

    main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 32px 24px; display: flex; }
    .container { max-width: 420px; margin: auto; width: 100%; display: flex; flex-direction: column; gap: 22px; }

    .head { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
    .head .logo { width: 60px; height: 60px; border-radius: 14px; background: linear-gradient(135deg, var(--teal), var(--teal-deep)); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 20px; }
    .head h1 { font-size: 21px; font-weight: 700; }
    .head p { font-size: 14px; color: var(--ink-soft); }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    /* שדה טלפון נעול — מודגש כדי שיהיה ברור שזה המספר שיוצא */
    .locked-label { font-size: 13px; font-weight: 700; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
    .phone-box {
      position: relative;
      display: flex; align-items: center; gap: 10px;
      background: #f1efe9;
      border: 1px dashed #c9c2b6;
      border-radius: 12px;
      padding: 16px 16px;
    }
    .phone-box .lock { font-size: 18px; opacity: .7; }
    .phone-box .num {
      flex: 1; font-size: 22px; font-weight: 700; letter-spacing: 1px;
      color: var(--ink); direction: ltr; text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .phone-box .tag {
      font-size: 11px; font-weight: 700; color: #fff; background: var(--teal-deep);
      padding: 4px 8px; border-radius: 999px; white-space: nowrap;
    }
    .locked-hint { font-size: 12px; color: var(--ink-faint); }

    .confirm { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--ink-soft); cursor: pointer; }
    .confirm input { margin-top: 3px; accent-color: var(--teal); width: 18px; height: 18px; cursor: pointer; flex: 0 0 auto; }

    button.submit {
      padding: 14px 16px; border-radius: 10px; font-size: 15px; font-weight: 700; color: #fff;
      background: var(--teal); border: none; cursor: pointer; font-family: inherit;
      transition: background .15s, opacity .15s;
    }
    button.submit:hover:not(:disabled) { background: var(--teal-deep); }
    button.submit:disabled { opacity: .4; cursor: not-allowed; }

    .msg { display: none; font-size: 14px; text-align: center; padding: 12px; border-radius: 10px; }
    .msg.bad { display: block; background: rgba(214,88,79,.1); color: var(--error); }

    .thankyou { display: none; text-align: center; }
    .thankyou.show { display: block; }
    .thankyou .icon { width: 66px; height: 66px; margin: 0 auto 16px; border-radius: 50%; background: rgba(23,163,163,.12); border: 2px solid var(--teal); display: grid; place-items: center; font-size: 30px; color: var(--teal-deep); }
    .thankyou h2 { font-size: 20px; margin-bottom: 8px; }
    .thankyou p { color: var(--ink-soft); font-size: 14px; }

    :focus-visible { outline: 2px solid var(--teal-deep); outline-offset: 2px; }
    @media (max-width: 480px) { main { padding: 20px 16px; } }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <span class="brand">Back to Life <small>· מרכז שליטה</small></span>
    </div>
  </header>

  <main>
    <div class="container" id="formWrap">
      <div class="head">
        <div class="logo">B2L</div>
        <h1>אישור יציאה מהמועדון</h1>
        <p>המספר הבא מסומן ליציאה מהמועדון. יש לאשר כדי להשלים את הבקשה.</p>
      </div>

      <form id="exitForm" novalidate>
        <div class="panel">
          <span class="locked-label">🔒 המספר שלך (נעול, לא ניתן לעריכה)</span>
          <div class="phone-box">
            <span class="lock">🔒</span>
            <span class="num" id="phoneDisplay">—</span>
            <span class="tag">יוצא מהמועדון</span>
          </div>
          <span class="locked-hint">אם המספר אינו נכון, אין לאשר — פני אלינו בהודעה חוזרת.</span>

          <!-- שדות נסתרים שנשלחים ל-webhook -->
          <input type="hidden" id="phone" name="phone" value="" />
          <input type="hidden" id="IDCRM" name="IDCRM" value="" />

          <label class="confirm">
            <input type="checkbox" id="confirmBox" name="exit_confirmed" value="true" />
            <span>אני מאשרת את היציאה מהמועדון ואת ההסרה מקבוצות הווטסאפ (באחריותי לצאת מהן בעצמי).</span>
          </label>
        </div>

        <button type="submit" class="submit" id="submitBtn" disabled>אישור יציאה</button>
        <div class="msg" id="msg"></div>
      </form>
    </div>

    <div class="container">
      <div class="thankyou" id="thankyou">
        <div class="icon">✓</div>
        <h2>הבקשה אושרה</h2>
        <p>קיבלנו את אישור היציאה. נטפל בהסרה מהמועדון בהקדם.</p>
      </div>
    </div>
  </main>

  <script>
    var WEBHOOK_URL = "https://hook.eu1.make.com/h6f2dg78wbcpl4l1lk8euxwg2xo6dwtu";
    var urlParams = new URLSearchParams(window.location.search);

    var phoneInput = document.getElementById("phone");
    var idcrmInput = document.getElementById("IDCRM");
    var phoneDisplay = document.getElementById("phoneDisplay");
    var confirmBox = document.getElementById("confirmBox");
    var submitBtn = document.getElementById("submitBtn");
    var form = document.getElementById("exitForm");
    var msg = document.getElementById("msg");

    // קליטת הפרמטרים מה-URL (רק IDCRM + phone לפי הצורך)
    var phoneVal = urlParams.get("phone") || "";
    idcrmInput.value = urlParams.get("IDCRM") || "";
    phoneInput.value = phoneVal;
    phoneDisplay.textContent = phoneVal || "לא סופק מספר";

    // אם אין מספר בלינק — לא ניתן לאשר
    if (!phoneVal) {
      confirmBox.disabled = true;
      msg.className = "msg bad";
      msg.textContent = "הלינק אינו כולל מספר טלפון. פני אלינו בהודעה חוזרת.";
    }

    confirmBox.addEventListener("change", function () {
      submitBtn.disabled = !confirmBox.checked;
    });

    function showBad(text) { msg.className = "msg bad"; msg.textContent = text; }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!confirmBox.checked) return;
      msg.className = "msg";

      // בניית payload: כל פרמטרי ה-URL (IDCRM + phone) + מטא-דאטה
      var payload = new URLSearchParams();
      urlParams.forEach(function (value, key) { payload.set(key, value); });
      payload.set("phone", phoneInput.value);
      payload.set("IDCRM", idcrmInput.value);
      payload.set("exit_confirmed", "true");
      payload.set("form", "club-exit-confirm");
      payload.set("submitted_at", new Date().toISOString());
      payload.set("page_url", window.location.href);

      submitBtn.disabled = true;
      submitBtn.textContent = "שולח...";

      fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: payload.toString()
      })
        .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); onSuccess(); })
        .catch(function (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = "אישור יציאה";
          showBad("אירעה שגיאה בשליחה. נסי שוב בעוד רגע.");
          console.error("Webhook error:", err);
        });
    });

    function onSuccess() {
      var redirect = urlParams.get("redirect");
      if (redirect) { window.location.href = redirect; return; }
      document.getElementById("formWrap").style.display = "none";
      document.getElementById("thankyou").classList.add("show");
    }
  </script>
</body>
</html>
