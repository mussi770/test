<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פגישת האימון נקבעה בהצלחה</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap');

  :root{
    --bg:#E9EFEF; --surface:#FFFFFF; --ink:#16202E; --muted:#6E7A85;
    --line:#E3E9E9; --navy:#17233A; --teal:#1C7C86; --brown:#9A7B4F;
    --radius:16px; --shadow:0 1px 2px rgba(20,32,46,.04), 0 18px 45px rgba(20,32,46,.10);
    --font:'Assistant', system-ui, sans-serif; --display:'Frank Ruhl Libre','Assistant',serif;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; padding:0; }
  body{ font-family:var(--font); background:var(--bg); color:var(--ink); direction:rtl;
    text-align:center; min-height:100vh; display:flex; align-items:center;
    justify-content:center; padding:24px; -webkit-font-smoothing:antialiased; }
  .card{ width:100%; max-width:560px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:48px 40px; }
  .badge{ width:88px; height:88px; margin:0 auto 26px; border-radius:50%;
    background:rgba(28,124,134,.10); display:flex; align-items:center; justify-content:center;
    animation:pop .4s cubic-bezier(.2,.8,.3,1.4) both; }
  .badge svg{ width:44px; height:44px; }
  .badge .check{ stroke-dasharray:30; stroke-dashoffset:30; animation:draw .45s .3s ease forwards; }
  h1{ font-family:var(--display); font-weight:700; font-size:28px; letter-spacing:-.01em;
    margin:0 0 12px; color:var(--ink); }
  p{ font-size:16.5px; line-height:1.7; color:var(--muted); margin:0 auto; max-width:430px; }
  .details{ margin-top:26px; padding:18px; background:rgba(28,124,134,.06);
    border:1px solid rgba(28,124,134,.20); border-radius:12px; }
  .details .row{ display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:15px; color:var(--ink); }
  .details .row + .row{ margin-top:10px; }
  .details svg{ width:19px; height:19px; flex-shrink:0; }
  .accent{ width:120px; height:3px; margin:30px auto 0; border-radius:3px;
    background:linear-gradient(90deg,var(--teal) 0%,#3E8C86 45%,var(--brown) 100%); }
  .powered{ margin-top:20px; font-size:13px; color:#9AA6A6; }
  @keyframes pop{ from{ transform:scale(.6); opacity:0; } to{ transform:scale(1); opacity:1; } }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @media (max-width:520px){ .card{ padding:38px 24px; } h1{ font-size:24px; } }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; }
    .badge .check{ stroke-dashoffset:0; } }
</style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="3" y="4.5" width="18" height="16" rx="2.5" stroke="#1C7C86" stroke-width="1.8"/>
        <path d="M3 9h18M8 2.5v4M16 2.5v4" stroke="#1C7C86" stroke-width="1.8" stroke-linecap="round"/>
        <path class="check" d="M8.5 14.5l2.4 2.4 4.6-4.8" stroke="#1C7C86" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>פגישת האימון נקבעה בהצלחה!</h1>

    <p>
      תודה רבה 🙏 שריינו עבורך את המועד שבחרת. שמחות שתצטרפי אלינו.
    </p>

    <div class="details">
      <div class="row">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="#17233A" stroke-width="1.7"/>
          <path d="M12 8v4l3 2" stroke="#17233A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>פרטי הפגישה ותזכורת יישלחו אלייך בהקדם.</span>
      </div>
      <div class="row">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6l8 5 8-5" stroke="#17233A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="4" y="5" width="16" height="14" rx="2" stroke="#17233A" stroke-width="1.7"/>
        </svg>
        <span>צריכה לשנות מועד? פשוט השיבי להודעה שתקבלי.</span>
      </div>
    </div>

    <div class="accent"></div>
    <div class="powered">Back to Life · מרכז לשיקום תנועתי של מיכל נהן</div>
  </main>
</body>
</html>
